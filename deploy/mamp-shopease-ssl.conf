# Local MAMP virtual host. Keep the certificate and key outside the document root.
Listen 127.0.0.1:8443 https
Listen [::1]:8443 https

<Directory "/Applications/MAMP/htdocs/E-Commerce-Management-System">
    Require all denied
</Directory>

<VirtualHost 127.0.0.1:8443 [::1]:8443>
    ServerName localhost:8443
    DocumentRoot "/Applications/MAMP/shopease-local-htdocs"
    SSLEngine on
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLCertificateFile "/Applications/MAMP/conf/apache/shopease-local/localhost.crt"
    SSLCertificateKeyFile "/Applications/MAMP/conf/apache/shopease-local/localhost.key"

    Header always set X-Frame-Options "DENY"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    # Keep the policy short on localhost, where other services share the hostname.
    Header always set Strict-Transport-Security "max-age=300"

    <Directory "/Applications/MAMP/shopease-local-htdocs/E-Commerce-Management-System">
        Options -Indexes
        AllowOverride FileInfo AuthConfig
        Require all granted
    </Directory>

    <LocationMatch "^/(?!E-Commerce-Management-System(?:/|$)|fcgi-bin/php\.fcgi(?:/|$))">
        Require all denied
    </LocationMatch>

    # MAMP internally redirects ShopEase PHP requests to this handler.
    <Location "/fcgi-bin/php.fcgi">
        Require expr "%{THE_REQUEST} =~ m#^[A-Z]+ /E-Commerce-Management-System/#"
    </Location>
</VirtualHost>
